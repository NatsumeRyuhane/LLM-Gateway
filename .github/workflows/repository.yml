name: Repository

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: repository-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check whitespace
        shell: bash
        run: |
          empty_tree="$(git hash-object -t tree /dev/null)"
          git diff --check "$empty_tree" HEAD
      - name: Require foundation documents
        shell: bash
        run: |
          required=(
            README.md
            CONTRIBUTING.md
            docs/TODO.md
            docs/ci.md
            docs/governance.md
            docs/requirements.md
            docs/architecture.md
            docs/threat-model.md
          )
          for path in "${required[@]}"; do
            test -s "$path" || {
              echo "required non-empty file is missing: $path" >&2
              exit 1
            }
          done
      - name: Check issue and workflow YAML
        shell: ruby --disable-gems {0}
        run: |
          require "yaml"

          paths = Dir[".github/**/*.yml", ".github/**/*.yaml"].sort
          paths.each { |path| YAML.parse_file(path) }
          puts "validated #{paths.length} YAML files"
      - name: Check generated-file consistency
        run: bash scripts/ci/verify-generated.sh
      - name: Check pull request commit messages
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci/check-commits.sh "$BASE_SHA" "$HEAD_SHA"
      - name: Check shared agent context
        shell: bash
        run: |
          test -L .claude
          test "$(readlink .claude)" = ".agents"
          required_context=(
            .agents/AGENTS.md
            .agents/CLAUDE.md
            .agents/README.md
          )
          for context_file in "${required_context[@]}"; do
            test -e "$context_file" || {
              echo "required agent context is missing: $context_file" >&2
              exit 1
            }
          done
